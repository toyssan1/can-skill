schema_version: "1.1"
name: diagnoses-mcp2515-esp32-silent
expected_outcome: |
  The answer finds the independent causes: the code says MCP_16MHZ but the module has an 8 MHz crystal;
  the library is left in loopback mode because setMode() is never called; the blue module's TJA1050
  transceiver needs 5 V and cannot run from 3.3 V (and its outputs need level shifting for an ESP32);
  and a 2019 Golf has a gateway, so the OBD port stays silent until a diagnostic request is sent.
  It gives corrected code or concrete next steps.
